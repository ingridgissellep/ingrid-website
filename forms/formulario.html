<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Ingrid G. Perez</title>
</head>
<body>

    <h1>Contact Me</h1>
    <p>Fill out the form below to get in touch.</p>

    <form action="#" method="post">

        <label for="fname">First Name:</label><br>
        <input type="text" id="fname" name="fname" placeholder="Enter your first name" required><br><br>

        <label for="lname">Last Name:</label><br>
        <input type="text" id="lname" name="lname" placeholder="Enter your last name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"><br><br>

        <label for="subject">Subject:</label><br>
        <select id="subject" name="subject">
            <option value="general">General Inquiry</option>
            <option value="job">Job Opportunity</option>
            <option value="feedback">Feedback</option>
        </select><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your message here"></textarea><br><br>

        <label for="contactmethod">Preferred contact method:</label><br>
        <input type="radio" id="contact-email" name="contactmethod" value="email">
        <label for="contact-email">Email</label>
        <input type="radio" id="contact-phone" name="contactmethod" value="phone">
        <label for="contact-phone">Phone</label><br><br>

        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
        <label for="subscribe">Subscribe to my newsletter</label><br><br>

        <input type="submit" value="Send Message">
        <input type="reset" value="Clear Form">

    </form>

</body>
</html>
