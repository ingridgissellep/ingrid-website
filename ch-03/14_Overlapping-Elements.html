<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Overlapping Elements</title>
  <style>
    img {
      position: absolute;
      left: 0px;
      top: 0px;
      z-index: -1;
    }
  </style>
</head>
<body>
  <h1>ABC Global Consulting</h1>
  <img src="logo.png" width="80" height="80" alt="ABC Global Consulting logo">
  <p>The image has a z-index of -1, therefore it is placed behind the text.</p>
</body>
</html>
